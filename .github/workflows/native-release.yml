name: Native release

on:
  push:
    branches: ["moonbit", "main"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev
      - name: Install MoonBit
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Validate and build
        run: |
          moon version
          moon -C impl/moonbit update
          moon -C impl/moonbit check --target native
          moon -C impl/moonbit test --target native
          python3 test/moonbit-native-cli/test-moonbit-http.py
          python3 test/moonbit-native-cli/test-moonbit-commands.py
          python3 test/moonbit-native-cli/test-moonbit-regressions.py
          python3 test/skill-sh-test/test-skill-launcher.py
          # Release-script tests need Babashka and run locally before tagging.
          moon -C impl/moonbit build --target native
      - name: Package existing binary
        run: bash scripts/package-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: target/native-release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: release
      - name: Create GitHub release with binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd release
          cat *.sha256 | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          # Do not overwrite assets of an existing version. A partial failure
          # stays a draft rather than exposing an incomplete release.
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}" \
            SHA256SUMS snlib-cli-linux-amd64 snlib-cli-linux-arm64 \
            snlib-cli-darwin-amd64 snlib-cli-darwin-arm64
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
